name: Sync Notion Movies to Website

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # 每天台灣時間 00:00 自動執行一次

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Notion Sync Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MOVIES_JSON_PATH: 'movies.json'
        run: python scripts/sync_notion_movies.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json
          if git diff --staged --quiet; then
            echo "No changes in movies.json to commit."
          else
            git commit -m "chore(data): auto-sync movies from Notion"
            git push
          fi
